name: Rebrand and Build Pro Player

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ProPlayer
        uses: actions/checkout@v4

      - name: Extract modified source ZIP
        run: |
          set -e

          ZIP="ProPlayer-rebranded-source.zip"
          test -f "$ZIP"

          mkdir -p /tmp/rebranded
          unzip -q "$ZIP" -d /tmp/rebranded

          ROOT="$(find /tmp/rebranded -name settings.gradle.kts -type f -print -quit)"
          test -n "$ROOT"

          SRC="$(dirname "$ROOT")"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$SRC"/ ./

      - name: Update branding references
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          for p in root.rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              if any(part.startswith("build") for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = text.replace(
                  "https://t.me/owntv",
                  "https://t.me/promaxsatdz"
              ).replace(
                  "https://github.com/ahXN00/OwnTV",
                  "https://github.com/najii04/ProPlayer"
              )

              if updated != text:
                  p.write_text(updated, encoding="utf-8")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProPlayer-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
