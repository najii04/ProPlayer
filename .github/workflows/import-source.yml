name: Import OwnTV Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ProPlayer
        uses: actions/checkout@v4

      - name: Download OwnTV source
        run: |
          set -e

          curl -fL \
            https://github.com/ahXN00/OwnTV/archive/refs/tags/v5.1.0.zip \
            -o /tmp/owntv.zip

          mkdir -p /tmp/source
          unzip -q /tmp/owntv.zip -d /tmp/source

          SRC="$(find /tmp/source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"

          rsync -a --exclude='.github/workflows/' "$SRC"/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Import OwnTV v5.1.0 source"
            git push
          fi
