
name: Rebrand and Build Pro Player

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rebrand:
    name: Build Pro Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ProPlayer
        uses: actions/checkout@v4

      - name: Extract modified source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ProPlayer-rebranded-source.zip"
          test -f "$ZIP"

          mkdir -p /tmp/rebranded
          unzip -q "$ZIP" -d /tmp/rebranded

          ROOT="$(find /tmp/rebranded -name settings.gradle.kts -type f -print -quit)"
          test -n "$ROOT"

          SRC="$(dirname "$ROOT")"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$SRC"/ ./

      - name: Fix Pro Player wordmark
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/tv/own/owntv/ui/components/BrandLockup.kt")
          text = p.read_text(encoding="utf-8")

          text = text.replace("import androidx.compose.material3.Text\n", "")
          text = text.replace("import androidx.compose.ui.text.font.FontWeight\n", "")
          text = text.replace("import androidx.compose.ui.unit.sp\n", "")

          marker = "fun Wordmark("
          if marker not in text:
              raise SystemExit("Wordmark function was not found.")

          start = text.index("    Box(\n", text.index(marker))
          end = text.index("\n}\n", start)

          replacement = "\n".join([
              "    Box(modifier.width(width).height(width * 182f / 988f)) {",
              "        Image(",
              "            painterResource(R.drawable.owntv_wordmark_own),",
              "            contentDescription = null,",
              "            modifier = Modifier.fillMaxSize(),",
              "            colorFilter = ColorFilter.tint(own),",
              "        )",
              "        Image(",
              "            painterResource(R.drawable.owntv_wordmark_tv),",
              "            contentDescription = null,",
              "            modifier = Modifier.fillMaxSize(),",
              "            colorFilter = ColorFilter.tint(tv),",
              "        )",
              "    }",
          ])

          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding="utf-8")
          PY

      - name: Update branding references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          for p in root.rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              if any(part.startswith("build") for part in p.parts):
                  continue

              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = text.replace(
                  "https://t.me/owntv",
                  "https://t.me/promaxsatdz"
              ).replace(
                  "https://github.com/ahXN00/OwnTV",
                  "https://github.com/najii04/ProPlayer"
              )

              if updated != text:
                  p.write_text(updated, encoding="utf-8")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug -x verifyI18nLiterals --stacktrace

      - name: Find APK files
        id: find-apks
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/proplayer-apks

          find app/build/outputs/apk -type f -name '*.apk' -print

          find app/build/outputs/apk -type f -name '*.apk' \
            -exec cp {} /tmp/proplayer-apks/ \;

          if ! find /tmp/proplayer-apks -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "No APK files were generated."
            echo "Listing app build output directories:"
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "APK files found:"
          ls -lh /tmp/proplayer-apks/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProPlayer-debug
          path: /tmp/proplayer-apks/*.apk
          if-no-files-found: error
          retention-days: 7
